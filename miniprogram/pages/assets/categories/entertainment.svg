<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 袖口（手腕处的袖子） -->
  <path d="M8 58l6-8 10 6-4 8z" fill="#A78BFA" fill-opacity="0.3" stroke="#A78BFA" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 手掌（从袖口伸出，托住手机底部） -->
  <path d="M14 50c1-3 4-5 8-5h6c2 0 3.5 1.5 3.5 3.5v0c0 1.5-1 2.5-2.5 2.5h-3" fill="#A78BFA" fill-opacity="0.2" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 拇指（沿手机左侧向上） -->
  <path d="M24 45c0-2 1.5-4 3.5-4s3.5 2 3.5 4v8" fill="#A78BFA" fill-opacity="0.2" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 手机机身（竖直，被手握住） -->
  <rect x="28" y="10" width="22" height="36" rx="4" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- 顶部听筒 -->
  <path d="M36 14h6" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 屏幕内容：标题 + 两行 -->
  <rect x="31" y="19" width="16" height="3" rx="1.5" fill="#A78BFA"/>
  <rect x="31" y="25" width="12" height="2.4" rx="1.2" fill="#A78BFA" fill-opacity="0.55"/>
  <rect x="31" y="30" width="14" height="2.4" rx="1.2" fill="#A78BFA" fill-opacity="0.55"/>
  <!-- 底部 home 条 -->
  <rect x="34" y="41" width="10" height="1.8" rx="0.9" fill="#A78BFA" fill-opacity="0.55"/>
</svg>
